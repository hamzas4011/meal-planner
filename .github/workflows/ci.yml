name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MealPlanner.Api

      - name: Build
        run: dotnet build MealPlanner.Api --no-restore --configuration Release

  web:
    name: Build Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal-planner-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meal-planner-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + Vite)
        run: npm run build
